# Lint and test the clinic on every pull request, and on main.
#
# This workflow is metered: the repository is private, so every minute it
# spends is billed against the account's Actions allowance, and GitHub bills
# each matrix job separately. At 2,000 minutes a month, a suite that takes an
# hour is about thirty pushes — which a single day of iterative work can spend.
#
# Four things below keep that under control. None of them reduces what is
# checked before a merge.
#
# The suite had grown to 4,097 tests and was taking 38 to 59 minutes on one
# core — the same commit, the same day, a 54% spread on GitHub's shared
# runners. Splitting it across parallel *jobs* was the obvious answer and the
# wrong one: every job pays its own checkout and install, so the billed total
# goes up. The runner already has four cores and was using one of them.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. Supersede, don't queue. Pushing three times to a branch used to start
#    three full runs and pay for all three, when only the last one's answer
#    was ever going to be read. The in-flight run is cancelled when a newer
#    commit arrives on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2. One interpreter while a pull request is being iterated on, both
        #    of them on main. The second one is tested on the commit where it
        #    matters, after the merge, and a branch under active development
        #    stops paying twice for every intermediate commit.
        #
        #    The second one is 3.14, the Python clinics are told to move to.
        #    It was 3.10 until Python 3.10's security fixes ended on
        #    2026-10-31: Pillow's fixes from then on (13.0) need 3.11, so the
        #    audit below failed on 3.10 with nothing requirements.txt could
        #    pin, and every 3.10 test after it was skipped. A clinic still on
        #    3.10 is told on the About page how to move
        #    (`project.python_past_security`), and `tools/check_wheels.py`
        #    still checks that 3.10 can install until it does.
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.11", "3.14"]' || '["3.11"]') }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        # 3. Cache the wheels. requirements.txt is long and installing it from
        #    scratch is billed like everything else; the cache key is the file
        #    itself, so it refreshes exactly when the dependencies change.
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-xdist
        # Tests only: an independent reading of the FHIR specification, to
        # check the files the clinic exports. Never installed in a clinic.
        python -m pip install "fhir.resources==7.1.0"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    # 5. No library with a known vulnerability reaches main. The advisory
    #    databases (PyPI's and OSV) are read for exactly the versions
    #    requirements.txt pins; a fix that exists has to be taken before the
    #    change merges. Seconds, against the suite's quarter of an hour.
    - name: Audit the libraries for known vulnerabilities
      run: |
        python -m pip install pip-audit
        pip-audit -r requirements.txt --progress-spinner off
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # 4. Use the cores the runner already has. `-n auto` is one job on four
    #    workers, so the wall clock falls and the *billed* minutes fall with
    #    it — a job is charged for how long it runs. Measured on this suite:
    #    15 minutes against 38–59, and every one of the 4,097 tests still
    #    runs.
    #
    #    `--dist loadfile` keeps every test in a file on the same worker.
    #    Tests within a file are the ones most likely to share a fixture or a
    #    path, and this costs nothing to be safe about: it measured 15:09
    #    against 15:29 for the free-for-all default.
    - name: Test with pytest
      run: |
        pytest -n auto --dist loadfile
