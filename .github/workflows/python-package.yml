# Lint and test the clinic on every pull request, and on main.
#
# This workflow is metered: the repository is private, so every minute it
# spends is billed against the account's Actions allowance. Measured from this
# repository's own successful runs, a run took a median of 22 minutes of wall
# clock — and GitHub bills each matrix job separately, so a two-job run cost
# about 45 minutes per push. At 2,000 minutes a month that is roughly 45
# pushes, which a single day of iterative work can spend.
#
# Three things below exist to keep that under control. None of them reduces
# what is checked before a merge.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. Supersede, don't queue. Pushing three times to a branch used to start
#    three full runs and pay for all three, when only the last one's answer
#    was ever going to be read. The in-flight run is cancelled when a newer
#    commit arrives on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2. One interpreter while a pull request is being iterated on, both
        #    of them on main. 3.10 is still tested — on the commit where it
        #    matters, after the merge — and a branch under active development
        #    stops paying twice for every intermediate commit.
        #
        #    3.10+ only: a dependency (rcpchgrowth) requires Python >= 3.10.
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.10", "3.11"]' || '["3.11"]') }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # 3. Cache the wheels. requirements.txt is long and installing it from
        #    scratch is billed like everything else; the cache key is the file
        #    itself, so it refreshes exactly when the dependencies change.
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
