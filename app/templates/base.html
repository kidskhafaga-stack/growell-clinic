<!DOCTYPE html>
{% set _u = current_user if current_user.is_authenticated else None %}
<html lang="{{ current_lang }}" dir="{{ direction }}"
      data-theme="{{ _u.theme if _u and _u.theme else 'light' }}"
      class="fs-{{ _u.font_scale if _u and _u.font_scale else 'md' }}"
      {% if _u and _u.accent_color %}style="--accent:{{ _u.accent_color }};"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app.name') }}{% endblock %} — {{ clinic_name }}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <!-- Alpine.js powers tabs, modals, dropdowns and transitions (no build step). -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body dir="{{ direction }}">
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
