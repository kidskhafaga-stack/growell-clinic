<!DOCTYPE html>
{% set _u = current_user if current_user.is_authenticated else None %}
<html lang="{{ current_lang }}" dir="{{ direction }}"
      data-theme="{{ _u.theme if _u and _u.theme else 'light' }}"
      class="fs-{{ _u.font_scale if _u and _u.font_scale else 'md' }}"
      {% if _u and _u.accent_color %}style="--accent:{{ _u.accent_color }};"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ clinic.name_ar if current_lang == 'ar' and clinic.name_ar else clinic.name }}{% endblock %} — {{ product_name }}</title>
  <!-- Vendored locally so the clinic works fully offline (no CDN dependency). -->
  <link rel="stylesheet"
        href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <!-- Alpine.js powers tabs, modals, dropdowns and transitions (no build step). -->
  <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body dir="{{ direction }}">
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
