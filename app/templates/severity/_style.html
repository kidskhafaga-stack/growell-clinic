<style>
  .sv-stack { display:grid; gap:14px; }

  .sv-chip.active { background:#dcfce7; color:#166534; }
  .sv-chip.draft { background:#fef3c7; color:#92400e; }
  .sv-chip.retired { background:#e5e7eb; color:#374151; }
